Georgia,serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="400" >Not ordinary sound: a fictional field-coupled informational signal.</text><rect x="40" y="812" width="1360" height="170" rx="8" fill="#f7f5ef" stroke="#c8c5bd"/>
 <text x="66" y="855" font-family="Georgia,serif" font-size="30" fill="#1a1a1a" text-anchor="start" font-weight="700" >Real-world boundary</text>
 <text x="66" y="880" font-family="Arial,sans-serif" font-size="10" fill="#6f6f6f" text-anchor="start" font-weight="700" letter-spacing="1.5">THREE KEY POINTS FOR A CLEARER CONVERSATION</text><line x1="402" y1="835" x2="402" y2="960" stroke="#c8c5bd"/>
   <circle cx="430" cy="849" r="16" fill="#efece2" stroke="#1a1a1a"/><text x="430" y="855" font-family="Georgia,serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700" >1</text>
   <text x="460" y="852" font-family="Georgia,serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="460" dy="0">Sound does not travel through vacuum.</tspan></text>
   <text x="460" y="900" font-family="Arial,sans-serif" font-size="12" fill="#6f6f6f" text-anchor="start" font-weight="400"><tspan x="460" dy="0">It requires a material medium such as air.</tspan></text><line x1="722" y1="835" x2="722" y2="960" stroke="#c8c5bd"/>
   <circle cx="750" cy="849" r="16" fill="#efece2" stroke="#1a1a1a"/><text x="750" y="855" font-family="Georgia,serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700" >2</text>
   <text x="780" y="852" font-family="Georgia,serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="780" dy="0">Electromagnetic signals travel at light speed.</tspan></text>
   <text x="780" y="900" font-family="Arial,sans-serif" font-size="12" fill="#6f6f6f" text-anchor="start" font-weight="400"><tspan x="780" dy="0">Light and radio propagate through space.</tspan></text><line x1="1042" y1="835" x2="1042" y2="960" stroke="#c8c5bd"/>
   <circle cx="1070" cy="849" r="16" fill="#efece2" stroke="#1a1a1a"/><text x="1070" y="855" font-family="Georgia,serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700" >3</text>
   <text x="1100" y="852" font-family="Georgia,serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="1100" dy="0">UMADA adds a fictional Ether-field layer.</tspan></text>
   <text x="1100" y="900" font-family="Arial,sans-serif" font-size="12" fill="#6f6f6f" text-anchor="start" font-weight="400"><tspan x="1100" dy="0">The speculative extension is labeled as fiction.</tspan></text>
