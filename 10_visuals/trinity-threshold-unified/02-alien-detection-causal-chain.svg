 <text x="66" y="850" font-family="Georgia,serif" font-size="30" fill="#1a1a1a" text-anchor="start" font-weight="700" >Why timing matters</text>
 <text x="66" y="877" font-family="Arial,sans-serif" font-size="10" fill="#6f6f6f" text-anchor="start" font-weight="700" letter-spacing="1.6">THREE REASONS THIS CHANGES THE DISCUSSION</text><line x1="364" y1="828" x2="364" y2="956" stroke="#c8c5bd"/>
   <circle cx="390" cy="844" r="16" fill="#efece2" stroke="#1a1a1a"/><text x="390" y="850" font-family="Georgia,serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700" >1</text>
   <text x="418" y="846" font-family="Georgia,serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="418" dy="0">Ordinary signals are limited by light-speed travel.</tspan></text>
   <text x="418" y="894" font-family="Arial,sans-serif" font-size="12" fill="#6f6f6f" text-anchor="start" font-weight="400"><tspan x="418" dy="0">Years or decades may separate sender and receiver.</tspan></text><line x1="694" y1="828" x2="694" y2="956" stroke="#c8c5bd"/>
   <circle cx="720" cy="844" r="16" fill="#efece2" stroke="#1a1a1a"/><text x="720" y="850" font-family="Georgia,serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700" >2</text>
   <text x="748" y="846" font-family="Georgia,serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="748" dy="0">A too-early response implies another mechanism.</tspan></text>
   <text x="748" y="894" font-family="Arial,sans-serif" font-size="12" fill="#6f6f6f" text-anchor="start" font-weight="400"><tspan x="748" dy="0">Timing itself becomes evidence inside the story.</tspan></text><line x1="1024" y1="828" x2="1024" y2="956" stroke="#c8c5bd"/>
   <circle cx="1050" cy="844" r="16" fill="#efece2" stroke="#1a1a1a"/><text x="1050" y="850" font-family="Georgia,serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700" >3</text>
   <text x="1078" y="846" font-family="Georgia,serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="1078" dy="0">UMADA names that mechanism Ether-field coupling.</tspan></text>
   <text x="1078" y="894" font-family="Arial,sans-serif" font-size="12" fill="#6f6f6f" text-anchor="start" font-weight="400"><tspan x="1078" dy="0">A fictional nonlocal informational channel.</tspan></text>
