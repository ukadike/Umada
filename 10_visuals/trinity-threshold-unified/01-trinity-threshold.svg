   <text x="1161" y="840" font-family="Georgia,serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="1161" dy="0">3I/ATLAS is not caused by Trinity.</tspan></text>
   <text x="1161" y="875" font-family="Arial,sans-serif" font-size="12" fill="#6f6f6f" text-anchor="start" font-weight="400"><tspan x="1161" dy="0">It remains an independent object.</tspan></text>
