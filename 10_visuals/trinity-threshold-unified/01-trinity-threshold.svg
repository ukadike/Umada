 <text x="170" y="675" font-family="Georgia,serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan x="170" dy="0">Earth sits inside a larger,</tspan><tspan x="170" dy="22.1">pre-existing Ether field.</tspan></text><rect x="312" y="170" width="260" height="600" rx="8" fill="#f7f5ef" stroke="#c8c5bd"/>
