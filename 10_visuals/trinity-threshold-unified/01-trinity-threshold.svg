 <text x="986" y="675" font-family="Georgia,serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan x="986" dy="0">Distant observers recognize</tspan><tspan x="986" dy="22.1">an anomalous shared signature.</tspan></text><rect x="1128" y="170" width="260" height="600" rx="8" fill="#f7f5ef" stroke="#c8c5bd"/>
