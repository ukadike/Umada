   <text x="351" y="840" font-family="Georgia,serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="351" dy="0">Ether Power already existed.</tspan></text>
   <text x="351" y="875" font-family="Arial,sans-serif" font-size="12" fill="#6f6f6f" text-anchor="start" font-weight="400"><tspan x="351" dy="0">Humanity did not create Ether.</tspan></text><line x1="567" y1="815" x2="567" y2="958" stroke="#c8c5bd"/>
   <circle cx="591" cy="835" r="16" fill="#efece2" stroke="#1a1a1a"/><text x="591" y="841" font-family="Georgia,serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700" >2</text>
   <text x="621" y="840" font-family="Georgia,serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="621" dy="0">Trinity did not move the Sun.</tspan></text>
   <text x="621" y="875" font-family="Arial,sans-serif" font-size="12" fill="#6f6f6f" text-anchor="start" font-weight="400"><tspan x="621" dy="0">Not a solar-system-scale event.</tspan></text><line x1="837" y1="815" x2="837" y2="958" stroke="#c8c5bd"/>
   <circle cx="861" cy="835" r="16" fill="#efece2" stroke="#1a1a1a"/><text x="861" y="841" font-family="Georgia,serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700" >3</text>
   <text x="891" y="840" font-family="Georgia,serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="891" dy="0">The signal is not ordinary sound.</tspan></text>
