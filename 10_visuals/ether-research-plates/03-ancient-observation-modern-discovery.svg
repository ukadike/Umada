<text x="330" y="735" fill="#c7a86a" font-family="Georgia,serif" font-size="18">The atomic event does not create Ether.</text><text x="330" y="762" fill="#eee7d8" font-family="Arial" font-size="14">It amplifies the coupling disturbance.</text><text x="330" y="800" fill="#9a927f" font-family="Arial" font-size="12">Large-scale energy release disturbs an already-existing field.</text><text x="330" y="822" fill="#9a927f" font-family="Arial" font-size="12">In UMADA, the event makes the coupling more detectable; it is not Ether’s origin.</text>
