<text x="1082" y="216" fill="#eee7d8" font-family="Arial" font-size="12">1 · Conditions align</text><text x="1082" y="247" fill="#eee7d8" font-family="Arial" font-size="12">2 · Discharge applied</text><text x="1082" y="278" fill="#eee7d8" font-family="Arial" font-size="12">3 · Conventional spike</text><text x="1082" y="309" fill="#eee7d8" font-family="Arial" font-size="12">4 · Ground and isolate</text><text x="1082" y="340" fill="#eee7d8" font-family="Arial" font-size="12">5 · Residual remains</text>
<rect x="1035" y="870" width="325" height="78" fill="#111416" stroke="#c7a86a"/><text x="1052" y="895" fill="#c7a86a" font-family="Georgia,serif" font-size="16">Observation</text><text x="1052" y="918" fill="#eee7d8" font-family="Arial" font-size="11">If conventional signals return to baseline but one</text><text x="1052" y="936" fill="#eee7d8" font-family="Arial" font-size="11">structured residual persists, coupling has occurred.</text>
<text x="420" y="910" fill="#c7a86a" font-family="Arial" font-size="12">CAUTION · Do not confuse trapped charge with Ether. Eliminate ordinary explanations first.</text>
